<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tap Rush</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #1e1e2f;
      color: #fff;
      font-family: sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #score-board { font-size: 1.5rem; margin-bottom: 20px; }
    #tap-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(255, 75, 43, 0.4);
      cursor: pointer;
      outline: none;
    }
    #tap-btn:active { transform: scale(0.95); }
    #msg { margin-top: 20px; font-size: 1.2rem; min-height: 1.5em; }
  </style>
</head>
<body>
  <div id="score-board">残り時間: <span id="time">10</span>s | スコア: <span id="score">0</span></div>
  <button id="tap-btn">START</button>
  <div id="msg">タップしてスタート！</div>

  <script>
    let score = 0;
    let timeLeft = 10;
    let timer = null;
    let playing = false;

    const btn = document.getElementById('tap-btn');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const msgEl = document.getElementById('msg');

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!playing) {
        startGame();
      } else {
        score++;
        scoreEl.textContent = score;
      }
    });

    function startGame() {
      score = 0;
      timeLeft = 10;
      playing = true;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      btn.textContent = 'TAP!';
      msgEl.textContent = '連打しろー！';

      timer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          playing = false;
          btn.textContent = 'RETRY';
          msgEl.textContent = `終了！ 記録: ${score} 回タップ！`;
        }
      }, 1000);
    }
  </script>
</body>
</html>
